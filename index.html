let currentWeek = "24.08.2026 — 30.08.2026";
const historyKey = "moe_pitanie_history";

function saveHistoryItem(text){
    let h = JSON.parse(localStorage.getItem(historyKey) || "[]");
    if(!h.includes(text)){ h.push(text); localStorage.setItem(historyKey, JSON.stringify(h)); }
}

function renderHistory(){
    let h = JSON.parse(localStorage.getItem(historyKey) || "[]");
    document.getElementById("historyList").innerHTML =
    "<div class='note'><b>Сохранённые недели:</b><br>24–30 августа 2026 — текущая неделя<br>18–24 августа 2026 — предыдущая неделя (меню, рецепты и покупки доступны через переключатель сверху).</div>" +
    "<div class='card'><b>Сейчас выбрана:</b> "+currentWeek+"</div>" +
    (h.length ? h.map(x=>"<div class='meal'>✅ "+x+"</div>").join("") :
    "<p>Пока нет сохранённых отметок.</p>");
}

function markCooked(name){
    saveHistoryItem(new Date().toLocaleDateString("ru-RU")+" — "+name);
    renderHistory();
    alert("Сохранено в истории");
}


function showDay(d){
 let h="<h2>"+d+"</h2>";
 weeks[currentWeek].menu[d].forEach(x=>{
   h+="<div class='meal'><b>"+x[0]+"</b><br>"+x[1];
   if(x[2]) h+="<br><button onclick=\"openRecipe('"+x[2]+"')\">📖 Открыть рецепт</button>";
   h+="</div>";
 });
 document.getElementById("day").innerHTML=h;
}
function openRecipe(id){
 tab("recipes");
 const r=weeks[currentWeek].recipes[id];
 document.getElementById("recipe").innerHTML="<h3>"+r.t+"</h3><p><b>⏱ Время:</b> "+r.time+" &nbsp; <b>🍽 Порция:</b> "+r.portion+"</p><h4>🧺 Ингредиенты</h4><ul>"+r.i.map(v=>"<li>"+v+"</li>").join("")+"</ul><h4>👨‍🍳 Приготовление</h4><ol>"+r.s.map(v=>"<li>"+v+"</li>").join("")+"</ol>";
}
function renderShop(){
 const shop=weeks[currentWeek].shop;
 document.getElementById("shopWeek").textContent=currentWeek;
 document.getElementById("shopList").innerHTML=Object.entries(shop).map(([group,items])=>"<div class='shop-group'><h3>"+group+"</h3>"+items.map((v,i)=>"<label><input type='checkbox' data-shop='"+currentWeek+"-"+group+"-"+i+"'> "+v+"</label>").join("")+"</div>").join("");
 document.querySelectorAll("[data-shop]").forEach(box=>{box.checked=localStorage.getItem("shop_"+box.dataset.shop)==="1";box.onchange=()=>localStorage.setItem("shop_"+box.dataset.shop,box.checked?"1":"0")});
}
function changeWeek(value){
 currentWeek=value;
 document.getElementById("recipe").innerHTML="Выберите блюдо из меню.";
 showDay("Понедельник"); renderShop(); renderHistory(); tab("menu");
}
function initWeeks(){
 const select=document.getElementById("weekSelect");
 select.innerHTML=Object.keys(weeks).map(w=>"<option value='"+w+"'>"+w+(w===currentWeek?" • новая":" • история")+"</option>").join("");
 select.value=currentWeek; renderShop();
}
function tab(id){ if(id==="history") renderHistory(); if(id==="shop") renderShop();
 document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
}
initWeeks();
showDay("Понедельник");
